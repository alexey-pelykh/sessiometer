name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned stand-in for `stable` — bumped deliberately, never floating, so a new stable
  # release can't introduce a lint that flips `main` red with no code change.
  RUST_STABLE: "1.96.0"
  # Minimum Supported Rust Version — keep in sync with `rust-version` in Cargo.toml.
  RUST_MSRV: "1.87.0"

jobs:
  # Per-job path filtering. The workflow has NO top-level `on: paths:` filter on purpose:
  # a workflow-level path filter makes the required status contexts stop reporting on any
  # PR that misses the filter, which wedges branch protection forever. Instead each real
  # job runs conditionally on these outputs, and `ci-ok` (below) is the single always-running
  # required check. A change to this workflow file re-runs EVERY filtered job — it is
  # listed in every filter — so CI edits are always validated end to end.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      swift: ${{ steps.filter.outputs.swift }}
      formula: ${{ steps.filter.outputs.formula }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              # `include_str!` compile-time inputs for the migration tests (src/migration.rs), the
              # wire goldens (src/daemon/snapshot_build.rs, src/stats.rs) and the CLI full-output
              # render goldens (build/fixtures/cli-renders/**, issue #767); a fixture-only edit is
              # still a Rust-affecting change and must run the Rust jobs — for the render goldens
              # especially, since a golden-only PR is exactly the shape a silent re-baseline takes.
              - 'build/fixtures/**'
              - 'scripts/**'
              # Cargo auto-detects these inputs, so a PR that adds one must run the Rust jobs — else
              # `deny` (no-Security.framework linkage + supply-chain gates) silently skips and the
              # security invariant self-bypasses: `.cargo/**` can inject linker flags or a source
              # replacement, `build.rs`/`**/build.rs` run arbitrary build-time code, and the
              # toolchain/fmt/lint files reconfigure the very gates below.
              - '.cargo/**'
              - 'build.rs'
              - '**/build.rs'
              - 'rust-toolchain.toml'
              - 'rust-toolchain'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
            # Canonical Homebrew formula (issue #567). Static-only checks, so this
            # filter is narrow: the formula itself, its guard, and this workflow.
            # `scripts/**` is already in the `rust` filter above, so a guard edit also
            # re-runs the Rust jobs — broad but conservative-safe, and deliberate there.
            formula:
              - 'Formula/**'
              - 'scripts/check-formula.sh'
              - '.github/workflows/ci.yml'
            swift:
              - 'apps/menubar/**'
              # The Rust-emitted wire goldens the Swift byte-drift guard pins against (issue #340,
              # apps/menubar/Tests/WireGoldenTests.swift). A daemon wire change regenerates these
              # under src/** with no apps/menubar/** touch, so without this the swift job would skip
              # and the cross-language drift would land uncaught. (Broad build/fixtures/** matches the
              # rust filter above; an unrelated migration-fixture edit just re-runs swift, which passes.)
              - 'build/fixtures/**'
              - '.github/workflows/ci.yml'

  # Full gate: format, lints, docs, build, tests. `-D warnings` clippy/rustdoc behavior is
  # toolchain-version-sensitive, so the toolchain is pinned (RUST_STABLE) rather than `stable`.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: doc
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  # MSRV gate: the crate must build and its tests must pass on the declared minimum
  # supported Rust version (Cargo.toml `rust-version`). Lints/docs are intentionally not
  # run here — `-D warnings` clippy/rustdoc drifts across toolchains and would fail on lint
  # churn unrelated to whether the crate actually works on the MSRV.
  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: No Security.framework SDK linkage
        run: ./scripts/check-no-security-framework.sh
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-deny
      - name: Supply-chain gates (advisories, sources, licenses)
        run: cargo deny check advisories sources licenses

  # Swift menu-bar app (apps/menubar/, issues #311, #322). Generates the Xcode project from
  # project.yml with XcodeGen, then builds the LSUIElement app AND runs the wire-decoder unit
  # tests (#322 added the MenubarTests standalone logic-test bundle). macos-latest ships a
  # full Xcode; XcodeGen comes from Homebrew. `xcodebuild test` builds `Menubar: all` (so the
  # app skeleton is still compiled) plus the test bundle, then runs it. Unsigned
  # (CODE_SIGNING_ALLOWED=NO) — Developer-ID signing + notarization is #171. The first step is
  # the zero-egress / pure-client guard (#328): the Swift-side peer of the `deny` job's
  # check-no-security-framework.sh, a source-level regression gate that fails if the app grows
  # a Security/Network-framework import, a host-networking symbol, or a network entitlement. It
  # runs here (not a new top-level job) so `ci-ok.needs` — asserted complete by
  # ci-ok-needs-complete (#318) — stays unchanged; the `swift` filter already gates it on
  # apps/menubar/** so it runs whenever the app changes.
  swift:
    name: swift
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Zero egress / pure-client (no Security/Network import, no network entitlement)
        run: ./scripts/check-menubar-zero-egress.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/menubar
        run: xcodegen generate
      - name: Build and test
        working-directory: apps/menubar
        run: |
          xcodebuild test \
            -project Menubar.xcodeproj \
            -scheme Menubar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  # Panel golden drift gate (issue #754) — DELIBERATELY NON-REQUIRED for now. `PanelGoldenParityTests`
  # re-renders every panel state in-process and diffs it against the committed goldens under
  # apps/menubar/design/renders/panel-goldens/. That comparison is the ONE cross-machine-sensitive
  # assertion in the suite (goldens rasterized on one machine, re-rendered on an unpinned macos-latest),
  # so it is env-gated OFF by default and runs only here: the rest of the suite — renders succeed, carry
  # ink, are deterministic, stay pairwise distinct, and every canary trips its predicate — are same-run
  # comparisons that already run in the required `swift` job above.
  #
  # WHY A SEPARATE JOB rather than one more step in `swift` (which would reuse that build): the issue's
  # promotion criterion is "N consecutive green runs", and counting those needs a named, queryable status
  # context. A soft step buried in `swift` would only be countable by grepping logs, which is not a
  # mechanism. The cost is one extra macOS build; it is gated on the same `swift` path filter, so it runs
  # only when the app changes.
  #
  # HOW "non-required" is achieved, and why it is done THIS way: EVERY step carries
  # `continue-on-error: true`, so the job's conclusion is always success and the `ci-ok` rollup can never
  # be blocked by it. The job still appears in `ci-ok.needs` — it must, or `ci-ok-needs-complete`
  # (issue #318) fails — but structurally cannot fail the gate.
  #
  # EVERY step, not just the gate step, and that distinction is the whole point. `ci-ok` fails on
  # `contains(needs.*.result, 'failure')`, and a job's result is failure if ANY un-guarded step fails —
  # so marking only the gate step soft would still let `brew install xcodegen` (a network operation, on
  # every apps/menubar/** PR) or a checkout blip block a merge. That is precisely the RISK-2 failure this
  # job's non-required landing exists to avoid, arriving through the setup steps instead of the assertion.
  # A setup failure surfaces as a RED soft verdict below, which is the honest reading: the gate did not
  # produce a measurement.
  #
  # Note this is NOT done by putting `continue-on-error` on the JOB: whether a continue-on-error job
  # reports `success` or `failure` in `needs.*.result` is not something this repo's merge gate should
  # depend on, so the soft-ness is placed at the steps, where the semantics are unambiguous.
  #
  # PROMOTION (making it required) is: drop every `continue-on-error` below and drop the reporting step.
  # The criterion, the counting command, and the re-calibration question that must be answered first are
  # recorded in apps/menubar/design/README.md § Panel golden drift gate.
  panel-goldens:
    name: panel-goldens
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      # Every step is soft — see the job comment. A setup failure must report a red VERDICT, never block a
      # merge; `ci-ok` fails on any un-guarded step in a needed job, setup steps included.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        continue-on-error: true
      - name: Install XcodeGen
        continue-on-error: true
        run: brew install xcodegen
      - name: Generate Xcode project
        continue-on-error: true
        working-directory: apps/menubar
        run: xcodegen generate
      - name: Panel golden drift gate (SOFT — cannot fail the build; see the job comment)
        id: gate
        continue-on-error: true
        working-directory: apps/menubar
        # `TEST_RUNNER_`-prefixed variables are forwarded to the xctest process with the prefix stripped —
        # a plain env var would NOT reach it, which is exactly how a "green" run could be a silently
        # skipped one. The two tests below `XCTSkipUnless` on the un-prefixed name, so a forwarding
        # regression shows up as `2 skipped` in the reporting step rather than as a false pass.
        env:
          TEST_RUNNER_SESSIOMETER_PANEL_GOLDEN_GATE: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Menubar.xcodeproj \
            -scheme Menubar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MenubarTests/PanelGoldenParityTests/testEveryRenderMatchesItsCommittedGolden \
            -only-testing:MenubarTests/PanelGoldenParityTests/testEachFreshRenderIsNearestToItsOwnGolden \
            2>&1 | tee panel-goldens.log
          # Degenerate-pass guard: a run where both tests SKIPPED would exit 0 and read as green while
          # asserting nothing (cardinality zero is an automatic fail, not a pass). Require two executed
          # tests and no skips.
          grep -qE 'Executed 2 tests, with 0 failures' panel-goldens.log
      - name: Report the soft-gate verdict
        if: always()
        # Soft too: if checkout failed there is no apps/menubar to run in, and this step would otherwise be
        # the un-guarded one that fails the job.
        continue-on-error: true
        run: |
          # The verdict line is the countable signal the promotion criterion reads, and the max-drift
          # figure is the measurement that criterion needs: `driftCeiling` was calibrated on ONE machine,
          # and only a run here can say what cross-machine antialiasing actually costs.
          log=apps/menubar/panel-goldens.log
          drift="$(grep -o '\[panel-goldens\] max drift .*' "$log" 2>/dev/null | tail -1)"
          # The relative gate's own coverage: how many cells have no same-size cross-state rival and so
          # rest on the absolute ceiling alone. Measured per run because a layout change moves it.
          margin="$(grep -o '\[panel-goldens\] weakest cross-state margin .*' "$log" 2>/dev/null | tail -1)"
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            echo "PANEL_GOLDEN_GATE_RESULT=green"
            {
              echo "### Panel golden drift gate: ✅ green (non-required)"
              echo
              echo "\`${drift:-no max-drift line found}\`"
              echo
              echo "\`${margin:-no margin line found}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PANEL_GOLDEN_GATE_RESULT=red"
            # One line by necessity: a `::warning` workflow command is not parsed across newlines.
            echo "::warning title=Panel golden drift gate::The gate did not report a clean measurement. This check is NON-REQUIRED and did not fail the build (issue #754). ${drift:-}"
            {
              echo "### Panel golden drift gate: ❌ red (non-required — did not fail the build)"
              echo
              echo "\`${drift:-no max-drift line found}\`"
              echo
              # Also one line by necessity: GFM renders a newline inside a paragraph as a line break.
              echo "Three things land here, and the max-drift line above distinguishes them: the panel changed (re-bless per apps/menubar/design/README.md § Panel golden drift gate); cross-machine antialiasing exceeds the ceiling (see that section's re-calibration note); or a SETUP step failed and no measurement was taken at all (no max-drift line)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Canonical Homebrew formula (issue #567). `Formula/sessiometer.rb` is the source the
  # published tap mirrors (ADR-0021), and until now nothing here checked it — the gap ADR-0021
  # records as "No CI covers the formula — on either side", and the root cause of #566: a
  # stanza-order defect reached the tap because the canonical formula was never audited.
  # Static-only (`brew style` + `brew audit --strict`) — no install/`test do`/bottle, none of
  # which this side should pay for: the crate build belongs to the tap's own test-bot CI
  # (#560 / sessiometer/homebrew-tap#1). That keeps this job cheap enough to run on every
  # `Formula/**` touch. macos-latest because the formula is `depends_on :macos`; the checks are
  # seconds (no compile), and macOS runners are free for this public repo. Guard logic lives in
  # scripts/check-formula.sh — like the `deny` and `swift` jobs' guards, runnable locally, with
  # a falsifier peer (scripts/check-formula.test.sh) proving it goes RED on #566's defect.
  formula:
    name: formula
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: brew style + brew audit --strict (canonical formula)
        run: ./scripts/check-formula.sh

  # Meta-check (issue #318): assert `ci-ok.needs` names every other job, so a new job can't be
  # added to this workflow and silently sit outside the merge gate's `needs.*.result` rollup.
  # GitHub exposes no "all jobs in this workflow" context, so the parse lives in a script — like
  # the `deny` job's `check-no-security-framework.sh`, and runnable locally. Runs always (no path
  # filter): the invariant must hold on every PR, including docs-only. Its result feeds `ci-ok`
  # below, so a failure here fails the gate — which is why it appears in `ci-ok.needs` itself.
  ci-ok-needs-complete:
    name: ci-ok-needs-complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Assert ci-ok.needs covers every job
        run: ./scripts/check-ci-ok-needs.sh

  # Documentation gates (issue #1060). Plural on purpose: this hosts whole-tree checks
  # over `docs/**`, and issue #1056's acceptance criteria already commit a second one, so
  # it lands here as a step rather than as another job needing its own `ci-ok.needs` entry.
  #
  # NO PATH FILTER, deliberately, and this is the load-bearing part. `ci-ok` counts a
  # `skipped` job as a PASS (only `failure`/`cancelled` fail its rollup), so a filtered
  # gate that misses is indistinguishable from one that ran clean — the gate would report
  # green having evaluated nothing, which is precisely the failure the check guards against
  # inside itself by treating a zero citation count as fatal. There is no `docs` filter to
  # reuse in any case; the `changes` job only publishes `rust`/`swift`/`formula`. The check
  # is a bash pass over `docs/`, so filtering it would buy nothing and risk exactly the
  # silence it exists to break.
  #
  # Not hosted in `gate-change-ack`: that job is PR-range-scoped (`fetch-depth: 0`, BASE/HEAD)
  # because trailer guards diff a commit range. This check inspects the TREE, needs neither,
  # and hosting it there would silently disable it on `push` builds.
  doc-gates:
    name: doc-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Assert every committed doc citation resolves in a fresh clone
        run: ./scripts/check-doc-citations.sh

  # Gate-integrity acknowledgment (issue #317). `ci-ok` and the invariants it rolls
  # up live in PR-mutable files — this workflow, `scripts/**`, `deny.toml`, `.cargo/**`.
  # `main-protection` has no bypass actors and GitHub forbids self-approval, so a
  # *required human review* on those paths would deadlock this solo repo forever
  # (which is why the issue's literal CODEOWNERS ask was rejected). Instead this job
  # makes a gate-definition change LOUD rather than silent: a PR whose diff touches a
  # gate path must carry a `Gate-Change-Acknowledged: <reason>` commit trailer. Like
  # `ci-ok-needs-complete`, it runs always (no path filter) so it can't be skipped
  # past, and it feeds `ci-ok` (hence its presence in `ci-ok.needs`). A PR touching no
  # gate path needs no ack and passes untouched, so ordinary PRs are never blocked.
  gate-change-ack:
    name: gate-change-ack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Need base + the PR's commits to diff gate paths and read commit trailers;
          # the default depth-1 checkout has neither.
          fetch-depth: 0
      - name: Require an ack trailer when a PR changes gate-definition files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-gate-change-ack.sh
      # Panel-golden re-baseline discipline (issue #754). Sibling trailer guard, hosted in this job
      # because it needs the identical fetch-depth-0 PR range and must be un-skippable for the same
      # reason. Distinct trailer (`Panel-Goldens-Rebaselined:`) and distinct question — "what changed in
      # the panel's appearance, and was it intended?" rather than "is this gate weakening safe?" — so the
      # two audit trails stay separately greppable. REQUIRED from day one even though the drift
      # comparison it protects lands non-required: this check is pure git and cannot be flaky, and a
      # re-baseline discipline that waits is worth nothing.
      - name: Require a justification when a PR re-baselines the panel goldens
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-panel-golden-rebaseline.sh
      # CLI full-output render-golden re-baseline discipline (issue #767). Third member of the
      # trailer-guard family, hosted here for the same reasons as the panel one: it needs the
      # identical fetch-depth-0 PR range and must be un-skippable. Distinct trailer
      # (`CLI-Goldens-Rebaselined:`) and distinct question — "what changed in the CLI's rendered
      # TEXT?" rather than the panel's "appearance" or `Gate-Change-Acknowledged:`'s "is this gate
      # weakening safe?" — so all three audit trails stay separately greppable.
      - name: Require a justification when a PR re-baselines the CLI render goldens
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-cli-golden-rebaseline.sh

  # Single always-running summary gate. This is the ONE check branch protection should
  # require: it runs on every PR/push regardless of path filters, and passes only when every
  # real job either succeeded or was legitimately path-skipped. That way a path-skipped
  # `test`/`msrv`/`deny`/`swift`/`formula` can never wedge a merge, while a genuine failure (or
  # a failed `changes` job) still blocks. Keep `test`/`msrv`/`deny` as named contexts for
  # history/visibility, but make `ci-ok` the required one.
  ci-ok:
    name: ci-ok
    if: always()
    # `panel-goldens` is listed because `ci-ok-needs-complete` requires every job to be — but its own
    # gate step is `continue-on-error`, so the job's conclusion is always success and it cannot block a
    # merge while it is soft-landing (issue #754). Promoting it to a real gate is a change in THAT job,
    # not here.
    needs: [changes, test, msrv, deny, swift, formula, panel-goldens, ci-ok-needs-complete, gate-change-ack, doc-gates]
    runs-on: ubuntu-latest
    steps:
      # `needs.*.result` auto-covers every job in `needs:` above — and the `ci-ok-needs-complete`
      # job asserts that list names every other job, so a new job can't be added to the workflow
      # and silently escape this rollup. A path-skipped job has result `skipped`, which is a pass;
      # only `failure`/`cancelled` fail this gate.
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job failed or was cancelled (results: ${{ join(needs.*.result, ', ') }})"
          exit 1
      - name: Summary
        run: |
          echo "All required jobs passed or were legitimately skipped (results: ${{ join(needs.*.result, ', ') }})."
