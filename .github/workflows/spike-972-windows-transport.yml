# The running half of the spike proofs under spikes/windows-control-transport/: the issue-#972
# transport proof (`cargo run`) and the issue-#1511 accept-loop / `watch` proof
# (`cargo run -- watch`). Two modes of one binary, two steps, one job — the second is the
# measurement ADR-0037 § What this spike did NOT establish assigns to the transport port.
#
# WHY THIS IS ITS OWN FILE, NOT A JOB IN ci.yml
#   scripts/check-ci-ok-needs.sh (issue #318) asserts that every job in ci.yml appears in
#   ci-ok.needs, and ci-ok is the ONE required status check on `main`. Adding this job there would
#   therefore make a throwaway spike proof a required check on every future PR in the repo — and
#   the spike's whole point is that it gets deleted once ADR-0037 is settled. A separate workflow
#   is invisible to that guard (it defaults to .github/workflows/ci.yml) and reports its own
#   context, which nothing requires.
#
# WHY A WORKFLOW-LEVEL PATH FILTER IS SAFE HERE AND IS NOT SAFE IN ci.yml
#   ci.yml's header explains that a workflow-level `paths:` filter makes its required contexts
#   stop reporting on any PR that misses the filter, which wedges branch protection forever. That
#   hazard is entirely a property of being REQUIRED. This workflow is not required by anything, so
#   a PR that misses the filter simply gets no run — the correct outcome for a spike.
#
# WHY A REAL WINDOWS RUNNER
#   The repo has no Windows host (ARM macOS, Linux-only Docker). The installed
#   x86_64-pc-windows-msvc target gives `cargo check` only, which TYPE-CHECKS WITHOUT LINKING OR
#   RUNNING — the exact blindness class ADR-0029 records for the Mach `extern` block, and not
#   sufficient for the issue's AC2 ("a minimal Windows proof accepts a connection, round-trips one
#   framed message, and resolves the peer's identity"). Only an executed run answers that.
#
# READ THE VERDICT OFF THE EXIT CODE. BOTH proofs gate their own checks and return non-zero when
# one fails (spikes/windows-control-transport/src/proof.rs and .../src/accept_loop.rs), and each
# runs as its own step, so this job's pass/fail IS the finding rather than a log someone has to
# interpret. The second step runs even when the first FAILED, so a #972 regression cannot hide a
# #1511 answer; the job is red if either is.
#
# WHAT IS REPORTED RATHER THAN GATED, and it is not the same list in the two modes. In the #972
# proof: the two MEASUREMENT lines, because ADR-0037 quotes the SIDs they print — each property
# they report is gated beside them (CHECK 6, CHECK 5). In the #1511 proof: the MEASUREMENT line
# counting outstanding instances; the elapsed figures CHECK 7 and CHECK 9 print, where the check
# gates that the transition HAPPENED inside its attempt budget and never how long it took; and the
# closing ANSWER line, which mostly synthesises what CHECK 3 and CHECK 5-9 gate but does carry one
# step no check drives: that a refused refill PLUS the end of the exchange it served is what
# reaches zero instances. CHECK 9 reaches that same terminal state by a shorter road, dropping the
# listening instance directly, so the two are joined by reasoning rather than by the run — which is
# the bound issue #1511's authoritative AC3 comment records. On the spike's FIRST run the pre-read
# impersonation was deliberately un-gated, because its outcome was the open question; ADR-0037
# § Decision 4 now records the answer, and a recorded decision no check enforces is one a later
# run can regress in silence.
#
# LIFECYCLE: delete this file together with spikes/windows-control-transport/ once ADR-0037 is
# accepted and the dependent Windows items no longer need the proof re-runnable.
name: spike-972-windows-transport

on:
  pull_request:
    paths:
      - 'spikes/windows-control-transport/**'
      - '.github/workflows/spike-972-windows-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # A COPY of ci.yml's RUST_STABLE. Nothing reconciles the two, and ci.yml wins if they ever
  # disagree — pinned rather than floating for the same reason ci.yml pins it: this job runs
  # `clippy -- -D warnings`, so a new stable release could otherwise turn a throwaway job red with
  # no change to the spike. A red nobody can clear is worse than no job.
  RUST_STABLE: "1.96.0"

jobs:
  proof:
    name: proof (windows)
    runs-on: windows-latest
    defaults:
      run:
        # BOTH keys must sit in the SAME defaults block. A job-level `defaults: run:` REPLACES the
        # workflow-level one rather than merging key-by-key, so an earlier revision of this file
        # that declared `shell: bash` at workflow level and `working-directory` here got neither
        # honoured together: every step ran under pwsh while the file said bash. Measured from the
        # run log (`shell: C:\Program Files\PowerShell\7\pwsh.EXE`), not inferred — and it was
        # SILENT, because the summary step below is bash syntax that pwsh parses as a script-block
        # literal and discards at exit 0.
        shell: bash
        working-directory: spikes/windows-control-transport
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: spikes/windows-control-transport
      # `--locked` throughout: the spike commits its own Cargo.lock (the root lockfile does not
      # cover it, since the root manifest declares no [workspace] table), and a run that silently
      # re-resolved it would be proving something about a dependency set nobody reviewed.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --verbose
      - name: Run the proof
        run: cargo run --locked 2>&1 | tee proof-output.txt
      # The issue-#1511 accept-loop / `watch` measurement, a SECOND mode of the same binary. It
      # answers the residual ADR-0037 § What this spike did NOT establish assigns to the transport
      # port — how many instances the accept loop keeps outstanding and what happens when they are
      # exhausted — and it gates its own checks, so this step's pass/fail IS that answer. Kept a
      # separate STEP because ADR-0037 quotes the proof above and calls that output "the whole of
      # what the program printed"; appending to it would falsify the sentence on every later run.
      # It runs even if the proof above FAILED (`always()`): the two measure different properties,
      # and a #972 regression should not hide a #1511 answer. The job still fails if either does.
      - name: Run the accept-loop / watch proof (issue #1511)
        if: always()
        run: cargo run --locked -- watch 2>&1 | tee watch-proof-output.txt
      # The log IS the evidence ADR-0037 quotes, so lift it where a reader lands first rather than
      # leaving it several clicks deep. `always()`, because a FAILING proof's output is the more
      # informative of the two and is exactly what gets read.
      - name: Publish the proof's output to the job summary
        if: always()
        run: |
          {
            echo '### issue-#972 Windows control-transport proof'
            echo
            echo '```text'
            cat proof-output.txt 2>/dev/null || echo '(the proof produced no output — it failed before its first check)'
            echo '```'
            echo
            echo '### issue-#1511 accept-loop / watch proof'
            echo
            echo '```text'
            cat watch-proof-output.txt 2>/dev/null || echo '(the accept-loop proof produced no output — it failed before its first check)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
