# The running half of the issue-#972 spike proof — see spikes/windows-control-transport/.
#
# WHY THIS IS ITS OWN FILE, NOT A JOB IN ci.yml
#   scripts/check-ci-ok-needs.sh (issue #318) asserts that every job in ci.yml appears in
#   ci-ok.needs, and ci-ok is the ONE required status check on `main`. Adding this job there would
#   therefore make a throwaway spike proof a required check on every future PR in the repo — and
#   the spike's whole point is that it gets deleted once ADR-0037 is settled. A separate workflow
#   is invisible to that guard (it defaults to .github/workflows/ci.yml) and reports its own
#   context, which nothing requires.
#
# WHY A WORKFLOW-LEVEL PATH FILTER IS SAFE HERE AND IS NOT SAFE IN ci.yml
#   ci.yml's header explains that a workflow-level `paths:` filter makes its required contexts
#   stop reporting on any PR that misses the filter, which wedges branch protection forever. That
#   hazard is entirely a property of being REQUIRED. This workflow is not required by anything, so
#   a PR that misses the filter simply gets no run — the correct outcome for a spike.
#
# WHY A REAL WINDOWS RUNNER
#   The repo has no Windows host (ARM macOS, Linux-only Docker). The installed
#   x86_64-pc-windows-msvc target gives `cargo check` only, which TYPE-CHECKS WITHOUT LINKING OR
#   RUNNING — the exact blindness class ADR-0029 records for the Mach `extern` block, and not
#   sufficient for the issue's AC2 ("a minimal Windows proof accepts a connection, round-trips one
#   framed message, and resolves the peer's identity"). Only an executed run answers that.
#
# READ THE VERDICT OFF THE EXIT CODE. The proof gates its own checks and returns non-zero if any
# fails (spikes/windows-control-transport/src/proof.rs), so this job's own pass/fail IS the finding
# rather than a log someone has to interpret. The one deliberately UN-gated line is the pre-read
# impersonation attempt — its outcome is the open question ADR-0037 records, so asserting an answer
# here would assume the finding.
#
# LIFECYCLE: delete this file together with spikes/windows-control-transport/ once ADR-0037 is
# accepted and the dependent Windows items no longer need the proof re-runnable.
name: spike-972-windows-transport

on:
  pull_request:
    paths:
      - 'spikes/windows-control-transport/**'
      - '.github/workflows/spike-972-windows-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # A COPY of ci.yml's RUST_STABLE. Nothing reconciles the two, and ci.yml wins if they ever
  # disagree — pinned rather than floating for the same reason ci.yml pins it: this job runs
  # `clippy -- -D warnings`, so a new stable release could otherwise turn a throwaway job red with
  # no change to the spike. A red nobody can clear is worse than no job.
  RUST_STABLE: "1.96.0"

jobs:
  proof:
    name: proof (windows)
    runs-on: windows-latest
    defaults:
      run:
        # BOTH keys must sit in the SAME defaults block. A job-level `defaults: run:` REPLACES the
        # workflow-level one rather than merging key-by-key, so an earlier revision of this file
        # that declared `shell: bash` at workflow level and `working-directory` here got neither
        # honoured together: every step ran under pwsh while the file said bash. Measured from the
        # run log (`shell: C:\Program Files\PowerShell\7\pwsh.EXE`), not inferred — and it was
        # SILENT, because the summary step below is bash syntax that pwsh parses as a script-block
        # literal and discards at exit 0.
        shell: bash
        working-directory: spikes/windows-control-transport
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-06-30)
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: spikes/windows-control-transport
      # `--locked` throughout: the spike commits its own Cargo.lock (the root lockfile does not
      # cover it, since the root manifest declares no [workspace] table), and a run that silently
      # re-resolved it would be proving something about a dependency set nobody reviewed.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --verbose
      - name: Run the proof
        run: cargo run --locked 2>&1 | tee proof-output.txt
      # The log IS the evidence ADR-0037 quotes, so lift it where a reader lands first rather than
      # leaving it several clicks deep. `always()`, because a FAILING proof's output is the more
      # informative of the two and is exactly what gets read.
      - name: Publish the proof's output to the job summary
        if: always()
        run: |
          {
            echo '### issue-#972 Windows control-transport proof'
            echo
            echo '```text'
            cat proof-output.txt 2>/dev/null || echo '(the proof produced no output — it failed before its first check)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
